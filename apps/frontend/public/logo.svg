<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: tropical green (brand accent) -->
  <rect width="100" height="100" rx="20" fill="#45b870"/>

  <!-- Game cartridge silhouette — white line art -->
  <!-- Wide body (top) + narrower connector tab (bottom) -->
  <path d="M25 8 L75 8 Q83 8 83 16 L83 70 L75 70 L75 93 Q75 97 71 97 L29 97 Q25 97 25 93 L25 70 L17 70 L17 16 Q17 8 25 8 Z"
        fill="none" stroke="white" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Label area -->
  <rect x="27" y="17" width="46" height="36" rx="3.5"
        fill="none" stroke="white" stroke-width="3"/>

  <!-- Screw holes (lower body, classic cartridge detail) -->
  <circle cx="31.5" cy="60" r="3" fill="none" stroke="white" stroke-width="2.2"/>
  <circle cx="68.5" cy="60" r="3" fill="none" stroke="white" stroke-width="2.2"/>

  <!-- Connector pins (visible at bottom edge of cartridge) -->
  <line x1="35" y1="78" x2="35" y2="90" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <line x1="43" y1="78" x2="43" y2="90" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <line x1="50" y1="78" x2="50" y2="90" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <line x1="57" y1="78" x2="57" y2="90" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <line x1="65" y1="78" x2="65" y2="90" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
</svg>
